<svg xmlns="http://www.w3.org/2000/svg" width="630" height="880" viewBox="0 0 630 880">
  <defs>
    <linearGradient id="c-pearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0f6"/>
      <stop offset=".35" stop-color="#b9bfd0"/>
      <stop offset=".65" stop-color="#e3e6ef"/>
      <stop offset="1" stop-color="#9aa1b7"/>
    </linearGradient>
    <linearGradient id="c-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#47447f"/>
      <stop offset="1" stop-color="#2c2a58"/>
    </linearGradient>
    <linearGradient id="c-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16245e"/>
      <stop offset=".55" stop-color="#4e3a8c"/>
      <stop offset="1" stop-color="#e48aa6"/>
    </linearGradient>
    <linearGradient id="c-aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4dffc3" stop-opacity="0"/>
      <stop offset=".3" stop-color="#4dffc3" stop-opacity=".7"/>
      <stop offset=".7" stop-color="#7f8bff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#c77dff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="c-moon" cx=".38" cy=".35" r=".75">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f0d38f"/>
    </radialGradient>
    <radialGradient id="c-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9ff3ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9ff3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="c-blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="c-art"><rect x="48" y="104" width="534" height="400" rx="8"/></clipPath>
  </defs>

  <rect width="630" height="880" fill="url(#c-pearl)"/>
