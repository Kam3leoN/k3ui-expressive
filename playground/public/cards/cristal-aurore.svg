  <rect x="96" y="520" width="438" height="36" rx="18" fill="url(#c-pearl)"/>
  <text x="315" y="545" text-anchor="middle" font-family="Figtree, system-ui, sans-serif" font-size="18" font-style="italic" fill="#2c2a58">Gemme céleste, niveau 3</text>

  <rect x="48" y="576" width="534" height="214" rx="10" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/>
  <text x="72" y="624" font-family="Cinzel, 'Cormorant Garamond', Georgia, serif" font-size="26" font-weight="700" fill="#f3f0ff">Éclat prismatique</text>
  <text font-family="Figtree, system-ui, sans-serif" font-size="19" fill="#d9d4f5">
    <tspan x="72" y="662">Quand on l’incline, il renvoie la lumière</tspan>
    <tspan x="72" y="690">dans toutes les couleurs de l’aurore.</tspan>
  </text>
  <line x1="72" y1="716" x2="558" y2="716" stroke="#fff" stroke-opacity=".18"/>
  <text x="72" y="756" font-family="Figtree, system-ui, sans-serif" font-size="17" font-style="italic" fill="#b9b3e0">Né d’une nuit sans nuages, au sommet du monde.</text>

  <text x="52" y="830" font-family="Figtree, system-ui, sans-serif" font-size="15" fill="#cfcbea" fill-opacity=".8">Carte de démonstration</text>
  <text x="578" y="830" text-anchor="end" font-family="Figtree, system-ui, sans-serif" font-size="15" fill="#cfcbea" fill-opacity=".8">001/100</text>
